services:
  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: stone-class-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cvuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cvpassword}
      POSTGRES_DB: ${POSTGRES_DB:-cvapp}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cvuser} -d ${POSTGRES_DB:-cvapp}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - stone-network
    restart: unless-stopped

  # FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: stone-class-backend
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-cvuser}:${POSTGRES_PASSWORD:-cvpassword}@db:5432/${POSTGRES_DB:-cvapp}
      ENV: ${ENV:-development}
      DEBUG: ${DEBUG:-true}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      MODEL_PATH: ${MODEL_PATH:-app/models/model.pt}
      LABELS_PATH: ${LABELS_PATH:-app/models/labels.json}
      MODEL_VERSION: ${MODEL_VERSION:-1.0.0}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-8}
      ALLOWED_IMAGE_TYPES: ${ALLOWED_IMAGE_TYPES:-image/jpeg,image/png,image/webp}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY}
      LANGFUSE_HOST: ${LANGFUSE_HOST:-${LANGFUSE_BASE_URL:-https://cloud.langfuse.com}}
      LANGFUSE_BASE_URL: ${LANGFUSE_BASE_URL:-${LANGFUSE_HOST:-https://cloud.langfuse.com}}
      LLM_MODEL: ${LLM_MODEL}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - ./models:/app/models
      - /app/__pycache__
    networks:
      - stone-network
    restart: unless-stopped

  # Next.js Frontend
  frontend:
    build:
      context: ./frontend/stone-classification-openui
      dockerfile: Dockerfile
    container_name: stone-class-frontend
    ports:
      - "${FRONTEND_PORT:-3002}:3000"
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    depends_on:
      - backend
    networks:
      - stone-network
    restart: unless-stopped

  # Pipelines - Open WebUI Langfuse Integration
  pipelines:
    image: ghcr.io/open-webui/pipelines:main
    container_name: stone-class-pipelines
    ports:
      - "${PIPELINES_PORT:-9099}:9099"
    environment:
      PIPELINES_API_KEY: ${PIPELINES_API_KEY:-0p3n-w3bu!}
      PIPELINES_URLS: "https://github.com/open-webui/pipelines/blob/main/examples/filters/langfuse_v3_filter_pipeline.py"
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY}
      LANGFUSE_HOST: ${LANGFUSE_HOST:-https://cloud.langfuse.com}
    volumes:
      - pipelines_data:/app/pipelines
    networks:
      - stone-network
    restart: unless-stopped

  # Open WebUI Assistant
  openwebui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: stone-class-openwebui
    ports:
      - "${OPENWEBUI_PORT:-8080}:8080"
    environment:
      WEBUI_AUTH: ${WEBUI_AUTH:-False}
      OPENAI_API_BASE_URLS: "${OPENAI_API_BASE_URL:-http://backend:8000/v1};http://pipelines:9099"
      OPENAI_API_KEYS: "${OPENAI_API_KEY};${PIPELINES_API_KEY:-0p3n-w3bu!}"
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY}
      LANGFUSE_HOST: ${LANGFUSE_HOST:-${LANGFUSE_BASE_URL:-https://cloud.langfuse.com}}
      LANGFUSE_BASE_URL: ${LANGFUSE_BASE_URL:-${LANGFUSE_HOST:-https://cloud.langfuse.com}}
      BACKEND_URL: ${BACKEND_URL:-http://backend:8000}
      ENV: ${ENV:-development}
    depends_on:
      - backend
      - pipelines
    volumes:
      - openwebui_data:/app/backend/data
    networks:
      - stone-network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  openwebui_data:
    driver: local
  pipelines_data:
    driver: local

networks:
  stone-network:
    driver: bridge