services:
  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: stone-class-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - stone-network

  # FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: stone-class-backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      ENV: development
      DEBUG: "true"
      CORS_ORIGINS: "*"
      MODEL_PATH: /app/models/model.pt
      LABELS_PATH: /app/models/labels.json
      MODEL_VERSION: "1.0.0"
      MAX_UPLOAD_MB: "8"
      ALLOWED_IMAGE_TYPES: "image/jpeg,image/png,image/webp"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/__pycache__
    networks:
      - stone-network
    restart: unless-stopped

  # Next.js Frontend
  frontend:
    build:
      context: ./frontend/stone-classification-openui
      dockerfile: Dockerfile
    container_name: stone-class-frontend
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      - backend
    networks:
      - stone-network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local

networks:
  stone-network:
    driver: bridge
