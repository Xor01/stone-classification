services:
  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: stone-class-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - stone-network

  # FastAPI Backend
  backend:
    build:
        context: .
        dockerfile: ./backend/Dockerfile
    container_name: stone-class-backend
    ports:
      - "${BACKEND_PORT}:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      ENV: ${ENV}
      DEBUG: ${DEBUG}
      CORS_ORIGINS: ${CORS_ORIGINS}
      MODEL_PATH: /app/models/model.pt
      LABELS_PATH: /app/models/labels.json
      MODEL_VERSION: ${MODEL_VERSION}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB}
      ALLOWED_IMAGE_TYPES: ${ALLOWED_IMAGE_TYPES}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY}
      LANGFUSE_HOST: ${LANGFUSE_HOST:-${LANGFUSE_BASE_URL:-https://cloud.langfuse.com}}
      LANGFUSE_BASE_URL: ${LANGFUSE_BASE_URL:-${LANGFUSE_HOST:-https://cloud.langfuse.com}}
      LLM_MODEL: ${LLM_MODEL}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - stone-network
    volumes:
      - /opt/stone-classification/models:/app/models
    restart: unless-stopped

  # Next.js Frontend
  frontend:
    image: registry.digitalocean.com/air-quality-reg/stone-frontend:latest
    container_name: stone-class-frontend
    ports:
      - "${FRONTEND_PORT}:3000"
    environment:
      NODE_ENV: ${NODE_ENV}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    depends_on:
      - backend
    networks:
      - stone-network
    restart: unless-stopped

  # Open WebUI
  openwebui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: stone-class-openwebui
    ports:
      - "${OPENWEBUI_PORT}:8080"
    environment:
      WEBUI_AUTH: ${WEBUI_AUTH}
      OPENAI_API_BASE_URL: ${OPENAI_API_BASE_URL}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      ENABLE_LANGFUSE: "True"
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY}
      LANGFUSE_HOST: ${LANGFUSE_HOST:-${LANGFUSE_BASE_URL:-https://cloud.langfuse.com}}
      LANGFUSE_BASE_URL: ${LANGFUSE_BASE_URL:-${LANGFUSE_HOST:-https://cloud.langfuse.com}}
      BACKEND_URL: ${BACKEND_URL}
    volumes:
      - openwebui_data:/app/backend/data
    networks:
      - stone-network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local

  openwebui_data:
    driver: local

networks:
  stone-network:
    driver: bridge