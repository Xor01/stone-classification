[project]
name = "stone-classification-backend"
version = "0.1.0"
description = "FastAPI backend for the stone-classification CV agent project"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.141.1",
    "langchain>=1.3.15",
    "langchain-openai>=1.4.3",
    "langfuse>=4.14.4",
    "pillow>=12.3.0",
    "psycopg[binary]>=3.3.4",
    "pydantic-settings>=2.15.0",
    "python-multipart>=0.0.32",
    "sqlmodel>=0.0.39",
    "torch>=2.13.0",
    "torchvision>=0.28.0",
    "uvicorn[standard]>=0.52.2",
]

# Carried over from a teammate's earlier `uv init` in this same folder —
# not needed by the API itself (tensorflow/opencv are CV-training libs,
# langchain is agent-side). Kept as an optional group instead of a hard
# dependency so `uv sync` here stays fast; install with
# `uv sync --extra ml` only if this env is meant to be shared with the
# CV/agent code too.
[project.optional-dependencies]
ml = [
    "langchain>=1.3.15",
    "langchain-openai>=1.4.3",
    "opencv-python>=5.0.0.93",
    "tensorflow>=2.21.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]


[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

